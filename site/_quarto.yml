project:
  type: website
  output-dir: _site
  pre-render: _prerender.py
  post-render: _postrender.py
  resources:
    - "_redirects"
    - "index.json"
    - "fonts/*"
    - "files/*"
    - "favicon.svg"
    - "x402/prices/changes.xml"
    - "assets/*"
    - "assets/vendor/*"
    - "og/*"
    - "badges/seller/*"
    - "badges/status/*"
    - "x402/data/*"
    - "agents/data/*"
    - "predictions/data/*"
    - "predictions/data/ots/*"
    - "paper/files/*"
  render:
    - "*.qmd"
    - "!x402_index/"

website:
  title: "Wes Knipe"
  site-url: "https://wknipe.com"
  draft-mode: gone   # drafts (the essay stub) are not published; `quarto preview` still shows them
  repo-url: "https://github.com/doescodinggiteasier/wknipe-site"
  favicon: favicon.svg
  search: false
  open-graph: true
  twitter-card: true
  navbar:
    title: "Wes Knipe"
    collapse: false
    search: false
    right:
      - text: Data
        menu:
          - href: x402/index.qmd
            text: Market
          - href: x402/sellers/index.qmd
            text: Sellers
          - href: x402/buyers/index.qmd
            text: Buyers
          - href: x402/prices/index.qmd
            text: Prices
          - href: x402/solana/index.qmd
            text: Solana
          - href: access/index.qmd
            text: State of AI access
          - href: weekly/index.qmd
            text: This week in x402
          - href: x402/brief/index.qmd
            text: One-page brief
      - text: Tools
        menu:
          - href: x402/buy/index.qmd
            text: Best execution
          - href: x402/prices/comps.qmd
            text: Price comps
          - href: x402/status/index.qmd
            text: Endpoint status
          - href: check/index.qmd
            text: AI-policy checker
          - href: agents/index.qmd
            text: Agent benchmark
          - href: api/index.qmd
            text: API
          - href: badges/index.qmd
            text: Badges
      - href: writing/index.qmd
        text: Writing
      - href: about.qmd
        text: About
      - href: "#k"
        text: "Search ⌘K"
        aria-label: "Search the site"
  page-footer:
    left: |
      [wes@wknipe.com](mailto:wes@wknipe.com) · [API](/api/) · [Index](/index/) · [RSS](/feed.xml) · [GitHub](https://github.com/doescodinggiteasier/wknipe-site) · Code MIT · Data & writing CC BY 4.0

format:
  html:
    theme:
      light: [default, theme.scss, theme-base.scss]
      dark: [darkly, theme-dark.scss, theme-base.scss]
    respect-user-color-scheme: true
    toc: false
    page-layout: full
    title-block-banner: false
    smooth-scroll: false
    anchor-sections: false
    include-in-header:
      text: '<link rel="preload" href="/fonts/geist-latin-var.woff2" as="font" type="font/woff2" crossorigin>'
    include-after-body:
      text: '<script defer src="/assets/wk.js?v=19"></script>' 
