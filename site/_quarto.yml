project:
  type: website
  output-dir: _site
  pre-render: _prerender.py
  resources:
    - "_redirects"
    - "index.json"
    - "fonts/*"
    - "x402/data/*"
    - "agents/data/*"
    - "predictions/data/*"
    - "predictions/data/ots/*"
    - "paper/files/*"
  render:
    - "*.qmd"
    - "!x402_index/"

website:
  title: "Wes Knipe"
  site-url: "https://wknipe.com"
  draft-mode: gone   # drafts (the essay stub) are not published; `quarto preview` still shows them
  repo-url: "https://github.com/doescodinggiteasier/wknipe-site"
  navbar:
    title: "Wes Knipe"
    collapse: false
    search: false
    right:
      - href: writing/index.qmd
        text: Writing
      - href: index/index.qmd
        text: Index
      - href: about.qmd
        text: About
  page-footer:
    left: |
      [wes@wknipe.com](mailto:wes@wknipe.com) · [RSS](/feed.xml) · [GitHub](https://github.com/doescodinggiteasier/wknipe-site) · Code MIT · Data & writing CC BY 4.0

format:
  html:
    theme:
      light: [default, theme.scss, theme-base.scss]
      dark: [darkly, theme-dark.scss, theme-base.scss]
    respect-user-color-scheme: true
    toc: false
    page-layout: full
    title-block-banner: false
    smooth-scroll: false
    anchor-sections: false
